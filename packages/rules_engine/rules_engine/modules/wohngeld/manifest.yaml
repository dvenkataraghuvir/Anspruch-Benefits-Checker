# PLZ → Mietstufe assignment (primary location key).
# Source: WoGV Anlage (Wohngeldverordnung), valid 2026.
#   https://www.gesetze-im-internet.de/wogv/anlage.html
#
# Format: postal_code (5-digit string) → list of {municipality, mietstufe} candidates.
#   - One candidate per PLZ: resolve directly.
#   - Multiple candidates with the SAME Mietstufe: resolve directly (no ambiguity).
#   - Multiple candidates with DIFFERENT Mietstufen: require UserSituation.municipality
#     as a tiebreaker; raise AmbiguousMietstufe if it is absent or does not match.
#
# DO NOT guess or invent any entry. Leave as {} until you transcribe the complete
# WoGV Anlage list. An absent PLZ surfaces as CANNOT_DETERMINE("postal_code").
#
# TODO(official): populate from the complete WoGV Anlage PLZ list.
# Example shape (do not use these values — they are illustrative only):
#   "80331": [{municipality: "München", mietstufe: "VII"}]
#   "10115": [{municipality: "Berlin Mitte", mietstufe: "IV"}]
