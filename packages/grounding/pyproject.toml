[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anspruch-grounding"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["grounding*"]

[tool.setuptools.package-data]
grounding = ["../corpus/*.json"]
