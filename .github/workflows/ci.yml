name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual deploy: gh workflow run ci.yml --ref main

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dvenkataraghuvir/anspruch-backend
  RG: rg-anspruch

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install packages
        run: |
          pip install -e packages/core -e packages/rules_engine -e packages/grounding
          pip install -r apps/backend/requirements.txt
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  backend-image:
    name: Backend image
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to Azure
    needs: [backend-image]
    # Skipped until the Azure setup in docs/DEPLOYMENT.md has set these variables.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update backend
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RG" -n ca-anspruch-api --image "$IMAGE:${{ github.sha }}" --only-show-errors -o none
          echo "API_URL=https://$(az containerapp show -g "$RG" -n ca-anspruch-api --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Build website
        working-directory: apps/frontend
        run: |
          npm ci
          VITE_API_BASE_URL="$API_URL" npm run build

      - name: Get website deploy token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -g "$RG" -n swa-anspruch --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: apps/frontend/dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$API_URL/healthz"
